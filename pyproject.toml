[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pinbridge-sdk"
version = "1.0.1"
description = "Official Python SDK for the PinBridge API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "PinBridge" }]
keywords = ["pinbridge", "sdk", "api", "pinterest"]
urls = { Homepage = "https://pinbridge.io", Documentation = "https://docs.pinbridge.io", Repository = "https://github.com/pinbridge/python-sdk", Issues = "https://github.com/pinbridge/python-sdk/issues" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0,<1",
  "pydantic>=2.6.0,<3",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0,<25",
  "coverage[toml]>=7.0.0,<8",
  "pytest>=8.0.0,<9",
  "pytest-asyncio>=0.23.0,<1",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.5.0,<1",
  "tomli>=2.0.0,<3; python_version < '3.11'",
]
docs = [
  "mkdocs>=1.6.0,<2",
  "mkdocs-material>=9.5.0,<10",
  "mkdocstrings[python]>=0.26.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pinbridge_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
